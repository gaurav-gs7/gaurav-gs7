<text x="214" y="98" class="sans" font-size="14.5" fill="#8b93a1">Incident correlation and root-cause</text><text x="214" y="120" class="sans" font-size="14.5" fill="#8b93a1">analysis. Deterministic scoring first;</text><text x="214" y="142" class="sans" font-size="14.5" fill="#8b93a1">the LLM only explains.</text>
