<svg xmlns="http://www.w3.org/2000/svg" width="590" height="220" viewBox="0 0 590 220" role="img">
<defs>
  <radialGradient id="bg" cx="0.163" cy="0.500" r="0.75">
    <stop offset="0" stop-color="#151a26"/><stop offset="0.55" stop-color="#0d1016"/><stop offset="1" stop-color="#090b0f"/>
  </radialGradient>
  <radialGradient id="glowMint"><stop offset="0" stop-color="#78dec4" stop-opacity=".55"/><stop offset="1" stop-color="#78dec4" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowAmb"><stop offset="0" stop-color="#ffa852" stop-opacity=".55"/><stop offset="1" stop-color="#ffa852" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.35);opacity:.35}}
  .t1{animation:tw 3.1s ease-in-out infinite} .t2{animation:tw 4.3s ease-in-out infinite .7s}
  .t3{animation:tw 5.2s ease-in-out infinite 1.6s} .t4{animation:tw 3.7s ease-in-out infinite 2.4s}
  .pulse{animation:pulse 1.8s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes grow{0%,8%{transform:scaleY(0)}22%,88%{transform:scaleY(1)}100%{transform:scaleY(0)}}
  .grow{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:grow 6s ease-out infinite}
  .breathe{transform-box:fill-box;transform-origin:center;animation:breathe 2.6s ease-in-out infinite}
  
</style>
