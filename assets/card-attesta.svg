<text x="214" y="98" class="sans" font-size="14.5" fill="#8b93a1">Kubernetes reliability control plane:</text><text x="214" y="120" class="sans" font-size="14.5" fill="#8b93a1">readiness scoring, SLO-guarded rollouts</text><text x="214" y="142" class="sans" font-size="14.5" fill="#8b93a1">and automatic rollback.</text>
